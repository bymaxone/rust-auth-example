# Pinned toolchain for reproducible local and CI builds. `channel` is an exact
# stable version, bumped intentionally and never drifted. It sits above the MSRV
# floor (`rust-version = "1.90"` in `[workspace.package]`), which a dedicated CI
# job proves the workspace still compiles on. The `wasm32-unknown-unknown` target
# is present so the browser edge verifier builds from the same toolchain.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
