name: Bug report
description: Report a defect in the example application.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Do not report security vulnerabilities here** —
        use GitHub Security Advisories (see SECURITY.md). For everything else,
        please give us enough to reproduce.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      description: Which part of the project does this concern?
      options:
        - apps/api (Rust / axum service)
        - apps/web (Next.js console)
        - Local stack (Postgres / Redis / Mailpit)
        - CI / tooling / workflows
        - Documentation
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug, the expected behavior, and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal reproduction — commands, configuration, and any relevant env.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust toolchain version, and Node version.
    validations:
      required: false
