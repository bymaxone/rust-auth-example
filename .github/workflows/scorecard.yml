# OpenSSF Scorecard — an automated assessment of the repository's supply-chain
# posture (pinned actions, token permissions, branch protection, SAST, etc.).
#
# Publishing results and uploading SARIF need a public repository; while private
# the job is skipped (informational only) and becomes active once public.
#
# Actions are pinned to a commit SHA with the version in a trailing comment.

name: scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '31 5 * * 1'

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The assignment sits inside `if`, which `set -e` does not act on, so
          # the retry works without disabling error checking for the rest of the
          # step — a failed write to $GITHUB_OUTPUT must still fail the job.
          visibility=""
          for attempt in 1 2 3; do
            if visibility=$(gh api "repos/$REPO" --jq .visibility 2>/dev/null); then
              break
            fi
            visibility=""
            if [ "$attempt" -lt 3 ]; then
              sleep $(( attempt * 5 ))
            fi
          done

          if [ -z "$visibility" ]; then
            # Degraded rather than failed: a red workflow over a transient API
            # error is noise, and the warning keeps it from being silent.
            echo "::warning::Could not determine repository visibility after 3 attempts; treating it as non-public and skipping."
            echo "public=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            # Covers internal as well as private.
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped on a $visibility repository: uploading results needs a GitHub Code Security license, which is only free on public repositories."
          fi

  analysis:
    name: scorecard analysis
    needs: visibility
    if: ${{ needs.visibility.outputs.public == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload the SARIF results
      id-token: write # publish the signed results to the public viewer
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload SARIF to the code-scanning dashboard
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: results.sarif
