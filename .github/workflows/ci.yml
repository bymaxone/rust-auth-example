# Core CI pipeline. Job names are contractual — branch protection and the audit
# scripts reference them by name; do not rename without updating those references.
#
# build-library ── install ──┬── format
#                            ├── lint
#                            ├── typecheck
#                            ├── msrv
#                            ├── unit (pg + redis + mailpit services; two-pass 100% gate)
#                            ├── e2e-api ── e2e-web
#                            ├── e2e-web-live (pg + redis + mailpit; real API + console)
#                            ├── export-usage-check
#                            ├── supply-chain
#                            └── security (dependency review via bymaxone/.github; PR + public only)
# coverage-report (needs unit + e2e-api + e2e-web, always runs)
#
# Database credentials are never embedded in a connection string: the URL carries the
# user + host + db, and the password is supplied out-of-band via `PGPASSWORD`, which the
# libpq-compatible sqlx layer reads. Third-party actions are pinned to a commit SHA with the
# version in a trailing comment; Dependabot (github-actions ecosystem) keeps the SHAs current.
# The one exception is the org-owned reusable `bymaxone/.github` workflow, pinned to the moving
# major `@v1` by deliberate convention (org-internal, so a vetted CI fix propagates everywhere).

name: ci

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A syntactically valid placeholder so cargo builds and tests run without a live database
  # connection (SQLX_OFFLINE builds the query macros from the committed `.sqlx/` cache, so
  # this URL is never dialed).
  DATABASE_URL: postgres://postgres@localhost:5432/ci_placeholder
  SQLX_OFFLINE: 'true'

jobs:
  # Builds the linked browser package so the file: link resolves.
  build-library:
    name: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Build the @bymax-one/rust-auth browser package
        working-directory: .sibling-rust-auth/packages/rust-auth
        run: |
          pnpm install --no-frozen-lockfile --ignore-workspace
          pnpm build:wasm
          pnpm build
      - name: Install workspace (resolves the file-link)
        run: pnpm install --frozen-lockfile
      - name: Upload built package for web-consuming jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-auth-pkg
          path: |
            .sibling-rust-auth/packages/rust-auth/dist
            .sibling-rust-auth/packages/rust-auth/wasm
          retention-days: 1

  install:
    name: install
    needs: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  format:
    name: format
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: pnpm format:check

  lint:
    name: lint
    needs: [install, build-library]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-auth-pkg
          path: .sibling-rust-auth/packages/rust-auth
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm lint

  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-auth-pkg
          path: .sibling-rust-auth/packages/rust-auth
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo check --workspace
      - run: pnpm typecheck

  msrv:
    name: msrv
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The `+toolchain` override bypasses rust-toolchain.toml so the MSRV floor
      # is what actually compiles here.
      - run: cargo +1.90.0 check --workspace

  unit:
    name: unit
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The coverage gate is a TWO-PASS llvm-cov run: pass 1 with the database, Redis, and
    # Mailpit present exercises the DB-integration and live-delivery test bodies; pass 2 with
    # DATABASE_URL_TEST unset exercises the `else { skip }` guards those same tests carry.
    # Merging both covers every line, so the gate holds at 100% lines + functions. Regions are
    # not gated — the residual uncovered regions are defensive closures unreachable on stable,
    # matching the sibling library's bar.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: example_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8025/readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-auth-pkg
          path: .sibling-rust-auth/packages/rust-auth
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,sqlx-cli
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to the coverage database
        run: sqlx migrate run --source apps/api/migrations --database-url "$DATABASE_URL_TEST"
        env:
          DATABASE_URL_TEST: postgres://postgres@localhost:5432/example_app_test
      - name: Reset coverage counters
        run: cargo llvm-cov clean --workspace
      - name: API coverage — pass 1 (DB + Redis + Mailpit present)
        run: cargo llvm-cov nextest -p api --no-tests=pass --no-report
        env:
          DATABASE_URL_TEST: postgres://postgres@localhost:5432/example_app_test
      - name: API coverage — pass 2 (DATABASE_URL_TEST unset → skip guards)
        run: cargo llvm-cov nextest -p api --no-tests=pass --no-report
        env:
          # Exercise the Mailpit delivery test's skip arm so the merged report covers it while
          # keeping the test hermetic (it still skips on its own when no relay is reachable).
          MAILPIT_FORCE_SKIP: '1'
      - name: API coverage — merge + gate at 100% lines & functions
        run: >-
          cargo llvm-cov report --lcov --output-path lcov.info
          --ignore-filename-regex '(^|/)(main|bootstrap|seed)\.rs$'
          --fail-under-lines 100 --fail-under-functions 100
      - name: Web unit coverage
        run: pnpm -r --if-present run test:cov
      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-api
          path: lcov.info
          retention-days: 7
          if-no-files-found: ignore

  e2e-api:
    name: e2e-api
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: example_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8025/readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://postgres@localhost:5432/example_app_test
      REDIS_URL: redis://localhost:6379
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-nextest,sqlx-cli
      - name: Apply migrations
        run: sqlx migrate run --source apps/api/migrations --database-url "$DATABASE_URL_TEST"
      - name: Run api tests against Postgres service
        run: cargo nextest run -p api --no-tests=pass --test-threads 4

  e2e-web:
    name: e2e-web
    needs: e2e-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-auth-pkg
          path: .sibling-rust-auth/packages/rust-auth
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      - run: pnpm -r --if-present run test:e2e

  e2e-web-live:
    name: e2e-web-live
    needs: [build-library, install]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Drives the fully-wired stack — the Rust API, Postgres, Redis, Mailpit, and the Next
    # console — and runs the live Playwright journeys against it (register/verify, reset,
    # sessions revoke, OAuth-mocked, platform isolation, edge protection). The specs read
    # one-time codes from Mailpit's REST API exactly as an operator would.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: example_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8025/readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/example_app
      PGPASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      REDIS_NAMESPACE: rust_auth_example
      APP_ENV: development
      API_PORT: '4000'
      WEB_ORIGIN: http://localhost:3000
      EMAIL_PROVIDER: mailpit
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_FROM: no-reply@auth.local
      # Local-only throwaway fixtures — never real secrets. JWT_SECRET is >= 64 bytes and the
      # proxy verifier shares it; MFA_ENCRYPTION_KEY is base64 of 32 bytes.
      JWT_SECRET: ci_live_e2e_only_secret_0123456789abcdef0123456789abcdef0123456789abcd
      MFA_ENCRYPTION_KEY: ZGV2X29ubHlfbG9jYWxfMzJfYnl0ZV9rZXlfMDAwMDA=
      AUTH_JWT_SECRET_FOR_PROXY: ci_live_e2e_only_secret_0123456789abcdef0123456789abcdef0123456789abcd
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://localhost:4000
      NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED: 'false'
      MAILPIT_URL: http://localhost:8025
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-auth-pkg
          path: .sibling-rust-auth/packages/rust-auth
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: sqlx-cli
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations + seed the acme/globex tenants
        run: |
          sqlx migrate run --source apps/api/migrations --database-url "$DATABASE_URL"
          cargo run --quiet --bin seed
      - name: Build the API and the console
        run: |
          cargo build --bin api
          pnpm -C apps/web build
      - name: Start the API and wait for readiness
        run: |
          nohup ./target/debug/api > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4000/health >/dev/null && { echo "api ready"; break; }
            sleep 1
          done
          curl -sf http://localhost:4000/health || { echo "api failed to start"; cat "$RUNNER_TEMP/api.log"; exit 1; }
      - name: Start the console and wait for readiness
        run: |
          nohup pnpm -C apps/web start > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/auth/login && { echo "web ready"; break; }
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000/auth/login || { echo "web failed to start"; cat "$RUNNER_TEMP/web.log"; exit 1; }
      - name: Install the Playwright browser
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      - name: Run the live Playwright journeys
        run: pnpm -C apps/web test:e2e:live
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  build-web:
    name: build-web
    needs: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-auth-pkg
          path: .sibling-rust-auth/packages/rust-auth
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the Next.js console (production build)
        run: pnpm -C apps/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          INTERNAL_API_URL: http://localhost:8080
          AUTH_JWT_SECRET_FOR_PROXY: ci_build_only_placeholder_secret_min_32_chars

  export-usage-check:
    name: export-usage-check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-auth-pkg
          path: .sibling-rust-auth/packages/rust-auth
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:exports
      - run: pnpm check:public-api

  docs-link-check:
    name: docs-link-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      # setup-node honours the root `packageManager: pnpm`, so pnpm must be on PATH first.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      # Validate the relative documentation graph (cross-doc links + into the source tree). The
      # config skips external http(s) so the gate is deterministic and never third-party-flaky.
      - name: Check documentation links
        run: |
          shopt -s globstar
          for f in README.md docs/**/*.md; do
            npx --yes markdown-link-check@3.13.7 --quiet --config .markdown-link-check.json "$f"
          done

  supply-chain:
    name: supply-chain
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit

  # Dependency review via the org-wide reusable (bymaxone/.github → security.yml).
  # Gated on visibility so it stays green while this repo is private and activates
  # automatically once it is public.
  security:
    name: security
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high

  coverage-report:
    name: coverage-report
    needs: [unit, e2e-api, e2e-web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download API coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-api
          path: coverage
        continue-on-error: true
      - name: Summarize coverage
        run: echo "coverage-report — coverage artifacts aggregated."
