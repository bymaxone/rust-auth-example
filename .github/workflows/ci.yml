# Core CI pipeline. Job names are contractual — branch protection and the audit
# scripts reference them by name; do not rename without updating those references.
#
# build-library ──┬── install
#                 ├── format
#                 ├── lint
#                 ├── typecheck
#                 ├── msrv
#                 ├── unit
#                 ├── e2e-api ── e2e-web
#                 ├── export-usage-check
#                 ├── supply-chain
#                 └── dependency-review (PR only)
# coverage-report (needs unit + e2e-api + e2e-web, always runs)

name: ci

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A syntactically valid placeholder so cargo builds and tests run without a
  # live database connection.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci_placeholder

jobs:
  # Builds the linked browser package so the file: link resolves. It is a no-op
  # until the console (apps/web) and the link are wired.
  build-library:
    name: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build linked browser package
        run: echo "build-library — @bymax-one/rust-auth link not wired yet; skipping."

  install:
    name: install
    needs: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  format:
    name: format
    needs: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: pnpm format:check

  lint:
    name: lint
    needs: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm lint

  typecheck:
    name: typecheck
    needs: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo check --workspace
      - run: pnpm typecheck

  msrv:
    name: msrv
    needs: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
      # The `+toolchain` override bypasses rust-toolchain.toml so the MSRV floor
      # is what actually compiles here.
      - run: cargo +1.90.0 check --workspace

  unit:
    name: unit
    needs: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API unit coverage
        run: cargo llvm-cov nextest --no-tests=pass --lcov --output-path lcov.info
      - name: Web unit coverage
        run: pnpm -r --if-present run test:cov
      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: lcov.info
          retention-days: 7
          if-no-files-found: ignore

  e2e-api:
    name: e2e-api
    needs: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Integration tests and the high-port test stack are added later; the stub
      # has no integration tests, so the suite passes with nothing to run.
      - run: cargo nextest run --no-tests=pass

  e2e-web:
    name: e2e-web
    needs: e2e-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run test:e2e

  export-usage-check:
    name: export-usage-check
    needs: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:exports
      - run: pnpm audit:public-api

  supply-chain:
    name: supply-chain
    needs: build-library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit

  dependency-review:
    name: dependency-review
    needs: build-library
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Dependency review needs a public repository (or GitHub Advanced Security).
      # While the repository is private it is skipped so the check stays green; it
      # becomes informational once the repository is public.
      - name: Dependency review
        if: github.event.repository.visibility == 'public'
        continue-on-error: true
        uses: actions/dependency-review-action@v4

  coverage-report:
    name: coverage-report
    needs: [unit, e2e-api, e2e-web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download API coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-api
          path: coverage
        continue-on-error: true
      - name: Summarize coverage
        run: echo "coverage-report — coverage artifacts aggregated."
