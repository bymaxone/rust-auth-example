# Secret scan. Runs the gitleaks CLI (MIT) directly rather than the gitleaks
# GitHub Action, which requires a paid license for organizations. The CLI needs
# no license, works on private repositories, scans the committed history, and
# fails the check on a detected secret. Illustrative dev/example values (Mailpit,
# local fixtures, planning-doc samples) are allow-listed in .gitleaks.toml — they
# are not real keys. The downloaded binary is verified against its published
# SHA-256 checksum before execution.
#
# Actions are pinned to a commit SHA with the version in a trailing comment.

name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner
