# Release workflow — on a v* tag it builds and pushes the API and web images to
# GHCR, then records the release in docs/RELEASES.md via a bot commit on main.
#
# The two images are built as an independent matrix and each is guarded by a
# `docker manifest inspect` check, so the run is idempotent: re-pushing the same
# tag is a no-op, and a partial failure (API published, web failed) can be
# retried without overwriting the image that already published.
#
# This is the only workflow with cancel-in-progress: false — a release run must
# never be cancelled mid-flight. Every third-party action is pinned to a commit
# SHA with the human-readable version in a trailing comment.
#
# Published images (the [api, web] matrix expands to these concrete names):
#   ghcr.io/bymaxone/rust-auth-example-api   — apps/api/Dockerfile (distroless)
#   ghcr.io/bymaxone/rust-auth-example-web   — apps/web/Dockerfile (Next standalone)

name: release

on:
  push:
    tags:
      - 'v*'

# Least-privilege default: jobs widen only the scopes they need.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── check-tag ───────────────────────────────────────────────────────────────
  # Fail fast before any image is built: the pushed tag must match the version
  # declared in apps/api/Cargo.toml, so a release can only ship the version the
  # workspace actually carries.
  check-tag:
    name: check-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # The tag ref is attacker-influenceable, so it is read through env and
      # never interpolated straight into a shell script body.
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches the workspace version
        run: |
          VERSION="${TAG_NAME#v}"
          # Require an exact vX.Y.Z release tag — reject any pre-release/build suffix so a
          # malformed tag fails here, not deeper in semver parsing or image tagging.
          if ! printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag ${TAG_NAME} is not an exact vX.Y.Z release tag."
            exit 1
          fi
          APP_VERSION="$(grep -m1 -E '^version = "' apps/api/Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ "${VERSION}" != "${APP_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME} (version ${VERSION}) does not match apps/api/Cargo.toml version ${APP_VERSION}."
            exit 1
          fi
          echo "Tag ${TAG_NAME} matches the workspace version ${APP_VERSION}."

  # ── build-and-push ──────────────────────────────────────────────────────────
  build-and-push:
    name: build-and-push (${{ matrix.image }})
    needs: check-tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Scoped to this job so only the publish job can mint an OIDC token; it
      # backs OIDC-based build provenance/attestation on the pushed image.
      id-token: write
    strategy:
      # Build the two images independently: a web failure must not cancel an
      # already-successful API build, so the failed image can be retried alone.
      fail-fast: false
      matrix:
        image:
          - api
          - web
        include:
          # The web image bakes the public client config at build time; the API
          # image takes no build args. Repository variables override the safe
          # defaults (Settings → Variables → Actions).
          - image: web
            build-args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://example.com/api' }}
              NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED=${{ vars.NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED || 'false' }}
    env:
      # Untrusted tag ref via env — never inlined into a run: script body.
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Log in first so the idempotency check can query the private registry.
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action publishes the semver without the leading `v`
      # (tag `v1.2.3` → image `1.2.3`), so query that same tag here.
      - name: Check whether this image tag already exists
        id: check
        run: |
          VERSION="${TAG_NAME#v}"
          IMAGE="ghcr.io/bymaxone/rust-auth-example-${{ matrix.image }}:${VERSION}"
          if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "Image ${IMAGE} already exists — skipping publish."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Buildx
        if: steps.check.outputs.publish == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate image metadata
        id: meta
        if: steps.check.outputs.publish == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bymaxone/rust-auth-example-${{ matrix.image }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        if: steps.check.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}

  # ── update-releases-doc ─────────────────────────────────────────────────────
  # Prepend a row to docs/RELEASES.md on main so the release table stays
  # authoritative without a manual edit after each tag.
  update-releases-doc:
    name: update-releases-doc
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepend row to RELEASES.md
        run: |
          if grep -qF "| \`${TAG_NAME}\`" docs/RELEASES.md; then
            echo "Tag ${TAG_NAME} already recorded — skipping."
            exit 0
          fi
          VERSION="${TAG_NAME#v}"
          # The tracked library version is the bymax-auth-core dependency pin.
          LIB_VERSION="$(grep -m1 -oE 'bymax-auth-core[^\n]*version *= *"=?[0-9.]+"' apps/api/Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          LIB_VERSION="${LIB_VERSION:-0.0.0 (path)}"
          DATE="$(date -u +%Y-%m-%d)"
          IMAGES="ghcr.io/bymaxone/rust-auth-example-{api,web}:${VERSION}"
          ROW="| \`${TAG_NAME}\` | ${LIB_VERSION} | ${DATE} | ${IMAGES} |"
          awk -v row="${ROW}" '{ print } /<!-- releases:insert -->/ { print row }' docs/RELEASES.md > docs/RELEASES.md.tmp
          mv docs/RELEASES.md.tmp docs/RELEASES.md

      - name: Push bot commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: 'chore(release): record ${{ github.ref_name }} in RELEASES.md [skip ci]'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          file_pattern: docs/RELEASES.md
