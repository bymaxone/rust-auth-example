# Mutation testing — runs post-merge on `main` and on manual dispatch, never on
# PRs or a schedule (the org cost policy). On a push to `main` a paths-filter
# scopes the run to the changed workspace and cargo-mutants runs `--in-diff` on
# the merged API lines; on `workflow_dispatch` the full API surface is mutated.
# The API job gates on caught / (caught + missed) >= 0.95; the web job runs
# Stryker incrementally with break >= 95.
#
# Actions are pinned to a commit SHA with the version in a trailing comment.

name: mutation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect
    # Only gates push runs; on manual dispatch the mutation jobs run unconditionally.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
          # Full history so paths-filter can diff the push against its `before`
          # commit locally (a shallow checkout has no base to compare against).
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/src/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
            web:
              - 'apps/web/app/**'
              - 'apps/web/lib/**'
              - 'apps/web/components/**'
              - 'pnpm-lock.yaml'

  mutation-api:
    name: mutation-api
    needs: detect
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect.outputs.api == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: example_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8025/readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SQLX_OFFLINE: 'true'
      REDIS_URL: redis://localhost:6379
      DATABASE_URL_TEST: postgres://postgres@localhost:5432/example_app_test
      MAILPIT_URL: http://localhost:8025
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/link-library
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: cargo-mutants,cargo-nextest,sqlx-cli
      - name: Migrate the test database
        run: sqlx migrate run --source apps/api/migrations --database-url "$DATABASE_URL_TEST"
      # The full mutation sweep (~250 mutants × the DB-integration suite) is slow, so a
      # push to main scopes cargo-mutants to the lines that merge changed (`--in-diff`
      # against the previous main commit); a manual dispatch leaves the diff unset so the
      # full API surface is mutated on demand.
      - name: Compute the changed API surface (push only)
        if: github.event_name == 'push'
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          git diff "$base...HEAD" -- apps/api/src > api.diff
      - name: Mutation testing (api, floor 0.95)
        env:
          MUTANTS_IN_DIFF: ${{ github.event_name == 'push' && 'api.diff' || '' }}
        run: bash scripts/mutants-gate.sh

  mutation-web:
    name: mutation-web
    needs: detect
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Build the sibling @bymax-one/rust-auth browser package
        working-directory: .sibling-rust-auth/packages/rust-auth
        run: |
          pnpm install --no-frozen-lockfile --ignore-workspace
          pnpm build:wasm
          pnpm build
      - run: pnpm install --frozen-lockfile
      # Stryker (Vitest runner) over lib/components/hooks with break >= 95. The verbatim shadcn
      # `components/ui/*` wrappers are excluded in stryker.config.json as structural, not logic.
      - name: Mutation testing (web, Stryker, break 95)
        run: pnpm --dir apps/web mutation
