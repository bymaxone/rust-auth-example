# Mutation testing — weekly full run. Runs a complete (cold) mutation pass on
# both workspaces every Monday at 03:00 UTC to catch drift the per-PR incremental
# cache might mask, and opens a `mutation-drift` issue on failure. Also runnable
# on demand. The stub run steps are replaced with the real tools when the test
# suites exist.
#
# Actions are pinned to a commit SHA with the version in a trailing comment.

name: mutation-nightly

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-api:
    name: full-api
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Full mutation run (api)
        run: echo "full-api — cold cargo-mutants run for apps/api."

  full-web:
    name: full-web
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full mutation run (web)
        run: echo "full-web — cold Stryker run for apps/web."

  drift-issue:
    name: drift-issue
    needs: [full-api, full-web]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open a mutation-drift issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `mutation drift detected (${today})`,
              labels: ['mutation-drift'],
              body: 'The nightly full mutation run failed. Investigate surviving mutants before the next merge.',
            });
