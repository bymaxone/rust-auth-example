# Mutation testing — weekly full run. Runs a complete (cold) mutation pass on
# both workspaces every Monday at 03:00 UTC to catch drift the per-PR incremental
# cache might mask, and opens a `mutation-drift` issue on failure. Also runnable
# on demand. The stub run steps are replaced with the real tools when the test
# suites exist.
#
# Actions are pinned to a commit SHA with the version in a trailing comment.

name: mutation-nightly

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-api:
    name: full-api (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The full sweep (~250 mutants × the DB-integration suite, run in place and serially) is split
    # into 8 shards so each stays under the CI job cap; a shard mutates ~1/8 of the surface.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/8', '1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: example_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8025/readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SQLX_OFFLINE: 'true'
      REDIS_URL: redis://localhost:6379
      DATABASE_URL_TEST: postgres://postgres@localhost:5432/example_app_test
      MAILPIT_URL: http://localhost:8025
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          path: rust-auth-example
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: bymaxone/rust-auth
          persist-credentials: false
          path: rust-auth
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust-auth-example
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-mutants,cargo-nextest,sqlx-cli
      - name: Migrate the test database
        working-directory: rust-auth-example
        run: sqlx migrate run --source apps/api/migrations --database-url "$DATABASE_URL_TEST"
      - name: Full mutation run (api, shard ${{ matrix.shard }})
        working-directory: rust-auth-example
        run: cargo mutants -p api --in-place --shard ${{ matrix.shard }}

  full-web:
    name: full-web
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/link-library
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (toolchain set via input)
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Build the sibling @bymax-one/rust-auth browser package
        working-directory: .sibling-rust-auth/packages/rust-auth
        run: |
          pnpm install --no-frozen-lockfile --ignore-workspace
          pnpm build:wasm
          pnpm build
      - run: pnpm install --frozen-lockfile
      - name: Full mutation run (web, Stryker, break 95)
        run: pnpm --dir apps/web mutation

  drift-issue:
    name: drift-issue
    needs: [full-api, full-web]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open a mutation-drift issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `mutation drift detected (${today})`,
              labels: ['mutation-drift'],
              body: 'The nightly full mutation run failed. Investigate surviving mutants before the next merge.',
            });
