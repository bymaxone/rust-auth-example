# Dev config: AOF for durability, no RDB snapshots, volatile-LRU eviction.
# WARNING: No requirepass or bind directive -- DO NOT use this file in production.
# Production must add requirepass, bind, and disable dangerous commands.

# Container network isolation is the primary access control for dev.
# protected-mode disabled so the host process can connect via Docker NAT.
protected-mode no

# Data directory -- explicit so AOF files always land in the named volume.
dir /data

# Persistence: AOF only, no RDB snapshots.
appendonly yes
appendfsync everysec
# Disables fsync during AOF rewrite to avoid latency spikes; trade-off is up to
# ~30 s of writes in the OS buffer if the process crashes during a rewrite.
no-appendfsync-on-rewrite yes
save ""
rdbchecksum no
rdbcompression no

# Memory: volatile-lru evicts only keys that carry a TTL and never keys without
# one, so allkeys-lru is avoided to protect non-expiring keys. Token keys do carry
# a TTL and can still be evicted under pressure, so size maxmemory for the working set.
maxmemory 256mb
maxmemory-policy volatile-lru
maxmemory-samples 10

# Logging
loglevel notice
