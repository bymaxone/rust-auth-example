# gitleaks configuration for rust-auth-example.
#
# Extends the default rule set and allow-lists locations that intentionally carry
# illustrative, non-secret values: the planning blueprints under docs/ and the
# committed .env.example files. Real credentials are never committed anywhere;
# only local/dev/test placeholders (Mailpit, dev fixtures) appear in these files.

title = "rust-auth-example gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Illustrative dev/example values in planning docs and env examples are not real secrets."
paths = [
  '''(^|/)docs/''',
  '''(^|/)\.env\.example$''',
  '''(^|/)[^/]*\.env\.example$''',
]
